_metadata:
  schema_version: "5.6.30"
  scope: s2d_cartographer

cluster:
  name: "iic-azl-01"

identity:
  active_directory:
    domain_fqdn: "improbability.cloud"
    netbios_name: "IIC"
    lcm_user:
      username: "lcm-iic-azl-01"
      password: "keyvault://kv-iic-mgmt-01/lcm-password"
